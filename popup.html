<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 400px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    h2 {
      margin: 0 0 15px 0;
      font-size: 16px;
      color: #333;
    }
    #result {
      margin-top: 10px;
      padding: 10px;
      background-color: #f0f0f0;
      border-radius: 4px;
      word-break: break-all;
    }
    .link {
      color: #1a73e8;
      text-decoration: none;
      font-weight: bold;
    }
    .link:hover {
      text-decoration: underline;
    }
    .error {
      color: #d93025;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #1557b0;
    }
  </style>
</head>
<body>
  <h2>YouTube Shorts Link Extractor</h2>
  <button id="extractBtn">Extract Shorts Link</button>
  <div id="result"></div>
  <script src="popup.js"></script>
</body>
</html>
