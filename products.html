<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Pawsome Treats Co.</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container">
                <div class="nav-wrapper">
                    <div class="logo">
                        <h1>🐾 Pawsome Treats Co.</h1>
                        <p class="tagline">Wholesome Goodness for Your Best Friend</p>
                    </div>
                    <ul class="nav-links">
                        <li><a href="index.html">Home</a></li>
                        <li><a href="products.html" class="active">Products</a></li>
                        <li><a href="cart.html" class="cart-link">Cart (<span id="cart-count">0</span>)</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <div class="container">
                <h1>Our Premium Dog Treats</h1>
                <p>Browse our selection of healthy, delicious treats your pup will love</p>
            </div>
        </section>

        <section class="products-section">
            <div class="container">
                <div class="products-grid" id="all-products">
                    <!-- Products will be loaded by JavaScript -->
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Pawsome Treats Co. All rights reserved.</p>
            <p>Made with ❤️ for dogs everywhere</p>
        </div>
    </footer>

    <script src="cart.js"></script>
    <script>
        // Load all products
        document.addEventListener('DOMContentLoaded', function() {
            const productsContainer = document.getElementById('all-products');

            products.forEach(product => {
                const productCard = createProductCard(product);
                productsContainer.appendChild(productCard);
            });
        });
    </script>
</body>
</html>
