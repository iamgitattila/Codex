<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard - Tripwire Survey</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #F9FAFB;
            color: #1F2937;
            padding: 24px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 24px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #1F2937;
        }

        .subtitle {
            color: #6B7280;
            font-size: 16px;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-primary {
            background: #4F46E5;
            color: white;
        }

        .btn-primary:hover {
            background: #4338CA;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: white;
            color: #4F46E5;
            border: 2px solid #4F46E5;
        }

        .btn-secondary:hover {
            background: #EEF2FF;
        }

        .btn-danger {
            background: #EF4444;
            color: white;
        }

        .btn-danger:hover {
            background: #DC2626;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .stat-label {
            font-size: 14px;
            color: #6B7280;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #1F2937;
        }

        .stat-change {
            font-size: 14px;
            margin-top: 8px;
        }

        .stat-change.positive {
            color: #10B981;
        }

        .stat-change.negative {
            color: #EF4444;
        }

        .tripwire-section {
            margin-bottom: 24px;
        }

        .tripwire-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .tripwire-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #E5E7EB;
        }

        .tripwire-name {
            font-size: 24px;
            font-weight: 700;
            color: #1F2937;
        }

        .tripwire-id {
            font-size: 14px;
            color: #6B7280;
            background: #F3F4F6;
            padding: 4px 12px;
            border-radius: 20px;
            font-family: monospace;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .metric {
            background: #F9FAFB;
            padding: 16px;
            border-radius: 8px;
            border-left: 4px solid #4F46E5;
        }

        .metric-label {
            font-size: 13px;
            color: #6B7280;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .metric-value {
            font-size: 28px;
            font-weight: 700;
            color: #1F2937;
        }

        .conversion-rate {
            border-left-color: #10B981;
        }

        .conversion-rate .metric-value {
            color: #10B981;
        }

        .no-data {
            text-align: center;
            padding: 48px 24px;
            color: #6B7280;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .no-data-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .active-tripwire-badge {
            display: inline-block;
            background: #10B981;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-box {
            background: #EFF6FF;
            border-left: 4px solid #3B82F6;
            padding: 16px;
            border-radius: 8px;
            margin: 24px 0;
        }

        .info-box strong {
            color: #1E40AF;
        }

        table {
            width: 100%;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        th {
            background: #F3F4F6;
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: #1F2937;
            font-size: 14px;
            border-bottom: 2px solid #E5E7EB;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #E5E7EB;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .timestamp {
            font-size: 12px;
            color: #9CA3AF;
            font-family: monospace;
        }

        @media (max-width: 768px) {
            .tripwire-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .metrics-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📊 Tripwire Analytics Dashboard</h1>
            <p class="subtitle">Track conversion rates and compare tripwire performance</p>
            <div class="controls">
                <button class="btn btn-primary" onclick="refreshData()">🔄 Refresh Data</button>
                <button class="btn btn-secondary" onclick="exportData()">📥 Export CSV</button>
                <button class="btn btn-danger" onclick="clearData()">🗑️ Clear All Data</button>
            </div>
        </div>

        <!-- Active Tripwire Info -->
        <div class="info-box">
            <strong>🎯 Active Tripwire:</strong> <span id="activeTripwire"></span>
            <br>
            <small>Change the active tripwire in <code>config.js</code> by updating the <code>ACTIVE_TRIPWIRE</code> constant.</small>
        </div>

        <!-- Overall Stats -->
        <div class="stats-grid" id="overallStats">
            <!-- Stats will be inserted here -->
        </div>

        <!-- Tripwire Comparison -->
        <div class="tripwire-section">
            <h2 style="margin-bottom: 20px; font-size: 24px;">Tripwire Comparison</h2>
            <div id="tripwireCards">
                <!-- Tripwire cards will be inserted here -->
            </div>
        </div>

        <!-- Recent Events -->
        <div style="margin-top: 32px;">
            <h2 style="margin-bottom: 20px; font-size: 24px;">Recent Events</h2>
            <div style="overflow-x: auto;">
                <table id="recentEvents">
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Event</th>
                            <th>Tripwire</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Events will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        // Load analytics from localStorage
        function getAnalytics() {
            try {
                const stored = localStorage.getItem(ANALYTICS_CONFIG.storageKey);
                return stored ? JSON.parse(stored) : [];
            } catch (e) {
                console.error('Error loading analytics:', e);
                return [];
            }
        }

        // Calculate metrics
        function calculateMetrics() {
            const events = getAnalytics();
            const metrics = { tripwires: {} };

            const tripwireIds = [...new Set(events.map(e => e.tripwire_id).filter(Boolean))];

            tripwireIds.forEach(tripwireId => {
                const tripwireEvents = events.filter(e => e.tripwire_id === tripwireId);
                const tripwireName = tripwireEvents[0]?.tripwire_name || tripwireId;

                const pageViews = tripwireEvents.filter(e => e.event === 'page_view').length;
                const surveyStarts = tripwireEvents.filter(e => e.event === 'survey_start').length;
                const surveyCompletes = tripwireEvents.filter(e => e.event === 'survey_complete').length;
                const offerViews = tripwireEvents.filter(e => e.event === 'offer_view').length;
                const ctaClicks = tripwireEvents.filter(e => e.event === 'cta_click').length;

                const startRate = pageViews > 0 ? ((surveyStarts / pageViews) * 100).toFixed(2) : 0;
                const completionRate = surveyStarts > 0 ? ((surveyCompletes / surveyStarts) * 100).toFixed(2) : 0;
                const conversionRate = offerViews > 0 ? ((ctaClicks / offerViews) * 100).toFixed(2) : 0;

                metrics.tripwires[tripwireId] = {
                    name: tripwireName,
                    pageViews,
                    surveyStarts,
                    surveyCompletes,
                    offerViews,
                    ctaClicks,
                    startRate: parseFloat(startRate),
                    completionRate: parseFloat(completionRate),
                    conversionRate: parseFloat(conversionRate)
                };
            });

            return metrics;
        }

        // Render dashboard
        function renderDashboard() {
            const metrics = calculateMetrics();
            const events = getAnalytics();

            // Show active tripwire
            const activeTripwireElement = document.getElementById('activeTripwire');
            const activeTripwire = TRIPWIRES[ACTIVE_TRIPWIRE];
            if (activeTripwire) {
                activeTripwireElement.innerHTML = `<strong>${activeTripwire.name}</strong> (${ACTIVE_TRIPWIRE})`;
            }

            // Overall stats
            const totalPageViews = events.filter(e => e.event === 'page_view').length;
            const totalCTAClicks = events.filter(e => e.event === 'cta_click').length;
            const totalOfferViews = events.filter(e => e.event === 'offer_view').length;
            const overallConversion = totalOfferViews > 0 ? ((totalCTAClicks / totalOfferViews) * 100).toFixed(2) : 0;

            document.getElementById('overallStats').innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">Total Page Views</div>
                    <div class="stat-value">${totalPageViews}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Offer Views</div>
                    <div class="stat-value">${totalOfferViews}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Conversions</div>
                    <div class="stat-value">${totalCTAClicks}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Overall Conversion Rate</div>
                    <div class="stat-value">${overallConversion}%</div>
                </div>
            `;

            // Tripwire cards
            const tripwireCardsContainer = document.getElementById('tripwireCards');
            const tripwireIds = Object.keys(metrics.tripwires);

            if (tripwireIds.length === 0) {
                tripwireCardsContainer.innerHTML = `
                    <div class="no-data">
                        <div class="no-data-icon">📊</div>
                        <h3>No data yet</h3>
                        <p>Visit the survey page to start collecting analytics data.</p>
                        <a href="index.html" class="btn btn-primary" style="display: inline-block; margin-top: 16px; text-decoration: none;">Go to Survey</a>
                    </div>
                `;
            } else {
                tripwireCardsContainer.innerHTML = tripwireIds.map(tripwireId => {
                    const m = metrics.tripwires[tripwireId];
                    const isActive = tripwireId === ACTIVE_TRIPWIRE;

                    return `
                        <div class="tripwire-card">
                            <div class="tripwire-header">
                                <div>
                                    <div class="tripwire-name">
                                        ${m.name}
                                        ${isActive ? '<span class="active-tripwire-badge">Active</span>' : ''}
                                    </div>
                                    <div class="tripwire-id">${tripwireId}</div>
                                </div>
                            </div>
                            <div class="metrics-grid">
                                <div class="metric">
                                    <div class="metric-label">Page Views</div>
                                    <div class="metric-value">${m.pageViews}</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-label">Survey Starts</div>
                                    <div class="metric-value">${m.surveyStarts}</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-label">Survey Completes</div>
                                    <div class="metric-value">${m.surveyCompletes}</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-label">Offer Views</div>
                                    <div class="metric-value">${m.offerViews}</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-label">CTA Clicks</div>
                                    <div class="metric-value">${m.ctaClicks}</div>
                                </div>
                                <div class="metric conversion-rate">
                                    <div class="metric-label">Conversion Rate</div>
                                    <div class="metric-value">${m.conversionRate}%</div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // Recent events table
            const recentEvents = events.slice(-20).reverse();
            const eventsTableBody = document.querySelector('#recentEvents tbody');

            if (recentEvents.length === 0) {
                eventsTableBody.innerHTML = `
                    <tr>
                        <td colspan="4" style="text-align: center; padding: 24px; color: #6B7280;">
                            No events yet. Visit the survey page to start tracking.
                        </td>
                    </tr>
                `;
            } else {
                eventsTableBody.innerHTML = recentEvents.map(event => {
                    const timestamp = new Date(event.timestamp).toLocaleString();
                    const details = JSON.stringify(event).length > 100
                        ? JSON.stringify(event).substring(0, 100) + '...'
                        : JSON.stringify(event);

                    return `
                        <tr>
                            <td class="timestamp">${timestamp}</td>
                            <td><strong>${event.event}</strong></td>
                            <td>${event.tripwire_name || 'N/A'}</td>
                            <td style="font-size: 12px; color: #6B7280;">${details}</td>
                        </tr>
                    `;
                }).join('');
            }
        }

        // Refresh data
        function refreshData() {
            renderDashboard();
            console.log('Dashboard refreshed');
        }

        // Export to CSV
        function exportData() {
            const metrics = calculateMetrics();
            const events = getAnalytics();

            let csv = 'Tripwire,Page Views,Survey Starts,Survey Completes,Offer Views,CTA Clicks,Conversion Rate\n';

            Object.keys(metrics.tripwires).forEach(tripwireId => {
                const m = metrics.tripwires[tripwireId];
                csv += `"${m.name}",${m.pageViews},${m.surveyStarts},${m.surveyCompletes},${m.offerViews},${m.ctaClicks},${m.conversionRate}%\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `tripwire-analytics-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);

            console.log('Data exported');
        }

        // Clear all data
        function clearData() {
            if (confirm('Are you sure you want to clear all analytics data? This cannot be undone.')) {
                localStorage.removeItem(ANALYTICS_CONFIG.storageKey);
                renderDashboard();
                console.log('All data cleared');
                alert('All analytics data has been cleared.');
            }
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', renderDashboard);

        // Auto-refresh every 30 seconds
        setInterval(renderDashboard, 30000);
    </script>
</body>
</html>
