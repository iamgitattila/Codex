[project]
name = "homeowner-pseo-engine"
version = "1.0.0"
description = "Automated programmatic SEO content engine for Homeowner.wiki"
authors = [{name = "Homeowner.wiki Team"}]
requires-python = ">=3.11"
license = {text = "Proprietary"}

[project.urls]
Homepage = "https://homeowner.wiki"
Repository = "https://github.com/homeowner-wiki/pseo-engine"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=engine --cov-report=html"
