<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>How Prepared Are You for When SHTF?</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="survey.css" />

  <!-- Facebook Pixel -->
  <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod ?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n; n.loaded=!0; n.version='2.0'; n.queue=[]; t=b.createElement(e);
    t.async=!0; t.src=v; s=b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t,s)
    }(window, document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init','YOUR_PIXEL_ID');
    fbq('track','PageView');
  </script>
</head>

<body class="bg">
  <header class="hero">
    <div class="hero-inner">
      <h1>How Prepared Are You for When SHTF?</h1>
      <p>Take this 2-minute quiz to see your readiness level and claim a free survival book.</p>
      <a href="#survey" class="btn btn-primary">Start Survey</a>
    </div>
  </header>

  <main id="survey" class="container">
    <div class="card">
      <div class="progress"><div id="progressBar" class="progress-bar"></div></div>

      <form id="surveyForm">
        <!-- Question 1 -->
        <div class="q active" data-q="1">
          <label class="q-title">How confident are you that you could keep your family safe if society broke down tomorrow?</label>
          <div class="options">
            <label><input type="radio" name="q1" value="1" required> 1 Not confident</label>
            <label><input type="radio" name="q1" value="2"> 2 Somewhat unprepared</label>
            <label><input type="radio" name="q1" value="3"> 3 Moderately prepared</label>
            <label><input type="radio" name="q1" value="4"> 4 Well prepared</label>
            <label><input type="radio" name="q1" value="5"> 5 Totally ready</label>
          </div>
          <div class="nav"><button type="button" class="btn btn-primary next">Next</button></div>
        </div>

        <!-- Question 2 -->
        <div class="q" data-q="2">
          <label class="q-title">How many days of water do you have stored for your household?</label>
          <div class="options">
            <label><input type="radio" name="q2" value="1" required> None or less than 1 day</label>
            <label><input type="radio" name="q2" value="2"> 1-3 days</label>
            <label><input type="radio" name="q2" value="3"> 4-7 days</label>
            <label><input type="radio" name="q2" value="4"> 1-2 weeks</label>
            <label><input type="radio" name="q2" value="5"> 2+ weeks or filtration system</label>
          </div>
          <div class="nav">
            <button type="button" class="btn prev">Back</button>
            <button type="button" class="btn btn-primary next">Next</button>
          </div>
        </div>

        <!-- Question 3 -->
        <div class="q" data-q="3">
          <label class="q-title">How much non-perishable food do you have stockpiled?</label>
          <div class="options">
            <label><input type="radio" name="q3" value="1" required> Less than 3 days worth</label>
            <label><input type="radio" name="q3" value="2"> 3-7 days</label>
            <label><input type="radio" name="q3" value="3"> 1-2 weeks</label>
            <label><input type="radio" name="q3" value="4"> 2-4 weeks</label>
            <label><input type="radio" name="q3" value="5"> 1+ month</label>
          </div>
          <div class="nav">
            <button type="button" class="btn prev">Back</button>
            <button type="button" class="btn btn-primary next">Next</button>
          </div>
        </div>

        <!-- Question 4 -->
        <div class="q" data-q="4">
          <label class="q-title">Do you have a bug-out bag ready to go?</label>
          <div class="options">
            <label><input type="radio" name="q4" value="1" required> No, I don't have one</label>
            <label><input type="radio" name="q4" value="2"> I've been meaning to put one together</label>
            <label><input type="radio" name="q4" value="3"> Partially assembled</label>
            <label><input type="radio" name="q4" value="4"> Yes, fully packed for one person</label>
            <label><input type="radio" name="q4" value="5"> Yes, bags for whole family ready</label>
          </div>
          <div class="nav">
            <button type="button" class="btn prev">Back</button>
            <button type="button" class="btn btn-primary next">Next</button>
          </div>
        </div>

        <!-- Question 5 -->
        <div class="q" data-q="5">
          <label class="q-title">What's your level of first-aid/medical preparedness?</label>
          <div class="options">
            <label><input type="radio" name="q5" value="1" required> Just basic band-aids</label>
            <label><input type="radio" name="q5" value="2"> Basic first-aid kit</label>
            <label><input type="radio" name="q5" value="3"> Comprehensive first-aid kit</label>
            <label><input type="radio" name="q5" value="4"> Advanced supplies + training</label>
            <label><input type="radio" name="q5" value="5"> Trauma kit + medical professional skill</label>
          </div>
          <div class="nav">
            <button type="button" class="btn prev">Back</button>
            <button type="button" class="btn btn-primary next">Next</button>
          </div>
        </div>

        <!-- Question 6 -->
        <div class="q" data-q="6">
          <label class="q-title">How would you rate your self-defense capabilities?</label>
          <div class="options">
            <label><input type="radio" name="q6" value="1" required> No plan or equipment</label>
            <label><input type="radio" name="q6" value="2"> Basic awareness, no tools</label>
            <label><input type="radio" name="q6" value="3"> Some tools, minimal training</label>
            <label><input type="radio" name="q6" value="4"> Well-equipped, some training</label>
            <label><input type="radio" name="q6" value="5"> Highly trained + equipped</label>
          </div>
          <div class="nav">
            <button type="button" class="btn prev">Back</button>
            <button type="button" class="btn btn-primary next">Next</button>
          </div>
        </div>

        <!-- Question 7 -->
        <div class="q" data-q="7">
          <label class="q-title">Do you have alternative power sources (generator, solar, etc.)?</label>
          <div class="options">
            <label><input type="radio" name="q7" value="1" required> No backup power</label>
            <label><input type="radio" name="q7" value="2"> Flashlights and batteries only</label>
            <label><input type="radio" name="q7" value="3"> Small portable charger/power bank</label>
            <label><input type="radio" name="q7" value="4"> Generator or solar panels</label>
            <label><input type="radio" name="q7" value="5"> Full off-grid power system</label>
          </div>
          <div class="nav">
            <button type="button" class="btn prev">Back</button>
            <button type="button" class="btn btn-primary next">Next</button>
          </div>
        </div>

        <!-- Question 8 -->
        <div class="q" data-q="8">
          <label class="q-title">How are your wilderness/survival skills?</label>
          <div class="options">
            <label><input type="radio" name="q8" value="1" required> Non-existent</label>
            <label><input type="radio" name="q8" value="2"> I've watched some videos</label>
            <label><input type="radio" name="q8" value="3"> Basic knowledge (fire, shelter)</label>
            <label><input type="radio" name="q8" value="4"> Practiced multiple skills</label>
            <label><input type="radio" name="q8" value="5"> Expert level bushcraft</label>
          </div>
          <div class="nav">
            <button type="button" class="btn prev">Back</button>
            <button type="button" class="btn btn-primary next">Next</button>
          </div>
        </div>

        <!-- Question 9 -->
        <div class="q" data-q="9">
          <label class="q-title">Do you have a communication plan if cell networks go down?</label>
          <div class="options">
            <label><input type="radio" name="q9" value="1" required> No plan at all</label>
            <label><input type="radio" name="q9" value="2"> Meeting point only</label>
            <label><input type="radio" name="q9" value="3"> Meeting point + written plan</label>
            <label><input type="radio" name="q9" value="4"> HAM radio or walkie-talkies</label>
            <label><input type="radio" name="q9" value="5"> Multiple systems + trained</label>
          </div>
          <div class="nav">
            <button type="button" class="btn prev">Back</button>
            <button type="button" class="btn btn-primary next">Next</button>
          </div>
        </div>

        <!-- Question 10 -->
        <div class="q" data-q="10">
          <label class="q-title">How often do you review and update your preparedness plans?</label>
          <div class="options">
            <label><input type="radio" name="q10" value="1" required> Never - don't have a plan</label>
            <label><input type="radio" name="q10" value="2"> Rarely think about it</label>
            <label><input type="radio" name="q10" value="3"> Once a year</label>
            <label><input type="radio" name="q10" value="4"> Every few months</label>
            <label><input type="radio" name="q10" value="5"> Monthly or more often</label>
          </div>
          <div class="nav">
            <button type="button" class="btn prev">Back</button>
            <button type="button" class="btn btn-primary next">Next</button>
          </div>
        </div>

        <!-- Data Capture -->
        <div class="q" data-q="11">
          <label class="q-title">Where should we send your free survival book?</label>
          <div class="grid2">
            <input type="text" name="first_name" placeholder="First name" required />
            <input type="email" name="email" placeholder="Email" required />
          </div>
          <label class="inline"><input type="checkbox" name="consent_offers"> Send me survival tips and offers</label>
          <div class="nav">
            <button type="button" class="btn prev">Back</button>
            <button type="submit" class="btn btn-primary">Finish</button>
          </div>
        </div>
      </form>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> Prepper Codex</p>
  </footer>

  <script src="survey.js"></script>
</body>
</html>
